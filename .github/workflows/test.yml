# loop-eng CI — the project's own philosophy applied to itself: "done" for a
# push must be a machine-verified fact, not a human remembering to run the
# suite. (Audit H3: releases previously relied entirely on a manual
# `bash tests/run-all.sh`.)
#
# Matrix notes:
# - ubuntu: shellcheck via apt; bash 5.x system-wide.
# - macos: stock /bin/bash is 3.2 — too old for the unattended drivers
#   (bash >= 4.4: empty-array expansion under set -u), so install brew bash
#   (lands first on PATH) + shellcheck. This makes the "hooks work on macOS,
#   unattended needs modern bash" claim a TESTED fact on 5.x.
# - test-bash32: a SEPARATE macOS job that does NOT install brew bash and runs
#   the six hooks-only suites through the stock /bin/bash (3.2) EXPLICITLY, so
#   the "hooks are bash-3.2 compatible" claim is machine-verified, not asserted.
#   It deliberately excludes the test-unattended-* suites (their drivers require
#   bash >= 4.4) and invokes /bin/bash by absolute path so it can never fall
#   through to a 5.x bash that happens to be on PATH.
#   update-notify.sh belongs in this leg for the same reason as the other three
#   hooks, and was the one missing from it: it is a SessionStart hook, so on a
#   stock macOS box it is bash 3.2 that runs it in every real session, while the
#   only thing asserting compatibility was a comment in its own header.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow on a `v*` tag so the release gate re-runs
  # the suite against the TAGGED tree rather than trusting whatever main was
  # when the tag was cut. Calling it keeps one definition of "the suite"; a
  # copy in release.yml would be two that drift.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: Install modern bash + shellcheck + coreutils (macOS)
        if: runner.os == 'macOS'
        # coreutils provides gtimeout, so the stop-gate's fail-closed timeout
        # path is exercised on macOS instead of SKIPped.
        run: brew install bash shellcheck coreutils

      # tests/test-manifest.sh runs `claude plugin validate` when the CLI is on
      # PATH and SKIPs with a note when it is not (the shellcheck convention).
      # Installing it here is what turns that SKIP into a real gate: the
      # validator is the only thing that reads frontmatter, manifest fields and
      # component references, and nothing else in this suite can see them.
      # Linux only — manifest validity is platform-independent, so paying for it
      # on all three legs would buy nothing.
      # Credential-free: the suite points CLAUDE_CONFIG_DIR at an empty temp dir,
      # verified to exit 0 there, so no secret is needed.
      # NOT made non-fatal with `|| true`: an install that fails silently would
      # turn the gate off while CI still reported green, which is the exact
      # silent-disarm shape the rest of this repo is built to refuse. Unpinned on
      # purpose too — a plugin ships to users running the CURRENT CLI, so that is
      # the validator whose verdict matters; if a new upstream rule reddens this
      # leg, that is a release blocker worth seeing, not noise to pin away.
      # Retried, because the one thing this install must not do is fail for a
      # reason that has nothing to do with the code. It is deliberately NOT
      # `|| true` (see above): a transient registry blip turning the manifest
      # gate off while CI stays green is the silent-disarm shape this repo
      # refuses. Three attempts with a backoff distinguishes "npm was flaky"
      # from "the install is actually broken", and only the second one reddens
      # the leg.
      - name: Install Claude Code CLI (Linux — enables the manifest gate)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if npm i -g @anthropic-ai/claude-code; then exit 0; fi
            echo "npm install attempt $attempt failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "npm i -g @anthropic-ai/claude-code failed three times — the manifest gate cannot run" >&2
          exit 1

      - name: Show tool versions
        run: |
          bash --version | head -1
          shellcheck --version | grep version: || true
          # Whether the manifest gate is live on this leg, stated rather than assumed.
          claude --version || echo "claude CLI absent — test-manifest will SKIP platform validation"

      - name: Run test suite
        run: bash tests/run-all.sh

  # Stock macOS bash is 3.2. This job proves the hooks + their scripts run there
  # by invoking the six hooks-only suites through /bin/bash directly. NO brew
  # bash here — that is the whole point. The unattended suites are excluded
  # because their drivers require bash >= 4.4.
  test-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Printing the version proves nothing on its own: if the runner image ever
      # ships a newer /bin/bash, a print-only step keeps this leg green while it
      # tests the wrong interpreter — the silent-disarm shape the rest of this
      # file refuses. Assert the major version, and let the print stay for the log.
      - name: Prove /bin/bash is stock 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ] || {
            echo "/bin/bash is ${BASH_VERSION}, not 3.x — this leg no longer tests the 3.2 floor" >&2
            exit 1
          }'

      - name: Run hooks-only suites under stock /bin/bash (3.2)
        run: |
          set -e
          for t in tests/test-arm-contract.sh \
                   tests/test-evidence-gate.sh \
                   tests/test-run-contract.sh \
                   tests/test-stop-gate.sh \
                   tests/test-hooks-json.sh \
                   tests/test-update-notify.sh \
                   tests/test-install-timer.sh; do
            echo "=== /bin/bash $t ==="
            /bin/bash "$t"
          done

      - name: Syntax-check the hooks-only scripts under /bin/bash (3.2)
        run: |
          set -e
          for f in tests/lib.sh \
                   hooks/stop-gate.sh \
                   hooks/evidence-gate.sh \
                   hooks/update-notify.sh \
                   skills/loop-eng/scripts/run-contract.sh \
                   skills/loop-eng/scripts/arm-contract.sh \
                   skills/loop-eng/scripts/install-timer.sh \
                   skills/loop-eng/scripts/uninstall-timer.sh; do
            /bin/bash -n "$f"
          done
